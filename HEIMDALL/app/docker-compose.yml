version: '3.8'

services:
  heimdall:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Default whitelabel configuration
      - WHITELABEL_APP_NAME=HEIMDALL Fleet Guardian
      - WHITELABEL_COMPANY_NAME=HEIMDALL
      - WHITELABEL_SUPPORT_EMAIL=support@heimdall.com.br
      - WHITELABEL_PRIMARY_COLOR=#3b82f6
      - WHITELABEL_SECONDARY_COLOR=#1e40af
      - WHITELABEL_ACCENT_COLOR=#93c5fd
      - WHITELABEL_ENABLE_BIOMETRIC_AUTH=true
      - WHITELABEL_ENABLE_GPS_LOCATION=true
      - WHITELABEL_ENABLE_FILE_UPLOAD=true
      - WHITELABEL_WELCOME_MESSAGE=Bem-vindo ao HEIMDALL Fleet Guardian
      - WHITELABEL_LOGIN_TITLE=Acesso ao Sistema
      - WHITELABEL_LOGIN_SUBTITLE=Gerencie seus firewalls de forma centralizada
      - WHITELABEL_FOOTER_TEXT=© 2026 HEIMDALL. Todos os direitos reservados.
      - WHITELABEL_COPYRIGHT_YEAR=2026
      
      # Demo mode settings
      - LOCAL_DEMO_MODE=true
      - VITE_LOCAL_DEMO_MODE=true
      
      # pfSense provider settings
      - PFSENSE_PROVIDER=mock
      
      # Supabase settings (for demo)
      - SUPABASE_URL=https://your-supabase-url.supabase.co
      - SUPABASE_PUBLISHABLE_KEY=your-supabase-pub-key
      - SUPABASE_SERVICE_ROLE_KEY=your-service-role-key
      
    volumes:
      - ./whitelabel-config.json:/app/whitelabel-config.json
      - ./backups:/app/backups
      - ./data:/app/data
    
    # Uncomment for production deployment
    # restart: unless-stopped
